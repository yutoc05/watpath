name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # CampusGeo and CampusModel only use Foundation, so they test cheaply on Linux.
  swift-packages:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/WatPathKit

  data-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - name: Compile campus bundle
        run: python3 tools/compiler/compile.py
