<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WatPath</title>
<!-- The README's opening banner: the brand, the tagline, and the two maps in one phone, split
     where the x-ray switch would wipe from one to the other. Screens come from the feature
     recording (build/readme/shots). -->
<link rel="stylesheet" href="common.css">
<style>
body { --w: 860px; --h: 500px; }
.backdrop { --gx: 72%; --gy: 40%; --glx: 70%; --gly: 46%; }
.backdrop::after { background: radial-gradient(ellipse 50% 70% at 70% 50%, rgb(243 179 61 / .16), transparent 70%); }
.copy { position: absolute; left: 52px; top: 0; bottom: 0; width: 380px; display: flex; flex-direction: column; justify-content: center; }
.lockup { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
.lockup img { width: 46px; height: 46px; border-radius: 11px; box-shadow: 0 0 0 1px rgb(255 255 255 / .08), 0 10px 30px -8px rgb(236 165 44 / .5); }
.lockup span { font: 700 27px/1 Quicksand, var(--sans); color: var(--honey); letter-spacing: -.4px; }
h1 { font-size: 52px; line-height: .98; letter-spacing: -.045em; }
.copy p.lede { margin-top: 20px; font-size: 15px; max-width: 362px; }
.legend { margin-top: 28px; display: flex; gap: 8px; flex-wrap: wrap; }
.legend .chip { color: var(--text); }
.phone.front { left: 486px; top: 46px; width: 236px; height: 500px; --radius: 40px; --bezel: 7px; z-index: 2; }
.phone.back { left: 664px; top: 96px; width: 204px; height: 432px; --radius: 36px; --bezel: 6px; z-index: 1; filter: brightness(.72) saturate(.9); }
.split { position: absolute; inset: 0; clip-path: polygon(62% 0, 100% 0, 100% 100%, 30% 100%); }
.seam { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.handle {
  position: absolute; left: calc(46% - 15px); top: calc(50% - 15px); width: 30px; height: 30px; z-index: 4; border-radius: 50%;
  background: rgb(20 19 17 / .72); backdrop-filter: blur(8px); border: 1px solid rgb(255 246 227 / .5);
  display: grid; place-items: center; box-shadow: 0 0 0 4px rgb(243 179 61 / .18), 0 6px 18px rgb(0 0 0 / .5);
}
.tag {
  position: absolute; z-index: 5; display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 9px; border-radius: 999px;
  background: rgb(27 25 23 / .88); border: 1px solid var(--hair-2); backdrop-filter: blur(10px);
  font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--cream);
  box-shadow: 0 10px 24px -10px rgb(0 0 0 / .8);
}
.tag i { width: 7px; height: 7px; border-radius: 50%; display: block; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="copy">
  <div class="lockup"><img src="../app-icon.svg" alt=""><span>WatPath</span></div>
  <h1>Every bridge.<br>Every tunnel.</h1>
  <p class="lede">An iPhone map of the corridors, bridges and tunnels that join 38 University of Waterloo buildings, with directions that keep you out of the cold.</p>
  <div class="legend">
    <span class="chip"><span class="swatch" style="background:#fff"></span>Corridors</span>
    <span class="chip"><span class="swatch" style="background:var(--bridge)"></span>Bridges</span>
    <span class="chip"><span class="swatch" style="background:var(--tunnel)"></span>Tunnels</span>
  </div>
</div>

<div class="phone back"><div class="screen"><img src="../../build/readme/shots/nav-indoor.png" alt=""></div></div>
<div class="phone front">
  <div class="screen">
    <img src="../../build/readme/shots/street-3d.png" alt="">
    <div class="split"><img src="../../build/readme/shots/path-3d.png" alt=""></div>
    <svg class="seam" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="62" y1="0" x2="30" y2="100" stroke="#F3B33D" stroke-width="5" opacity=".25" vector-effect="non-scaling-stroke" style="stroke-width:7px"/>
      <line x1="62" y1="0" x2="30" y2="100" stroke="#FFF6E3" vector-effect="non-scaling-stroke" style="stroke-width:1.5px"/>
    </svg>
    <div class="handle"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#FFF6E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5L1.5 7 5 10.5M9 3.5L12.5 7 9 10.5"/></svg></div>
  </div>
</div>
<div class="tag" style="left: 430px; top: 150px"><i style="background:#E9E4D6"></i>Street Map</div>
<div class="tag" style="left: 640px; top: 392px"><i style="background:var(--honey)"></i>Path Map</div>
<script src="common.js"></script>
<script>window.ready = WP.ready();</script>
</body>
</html>
