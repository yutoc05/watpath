<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WatPath feature clip stage</title>
<!-- The stage around a feature clip, 860 x 620: a phone on the left, which
     make_readme_media.py fills with the recording (SCREEN there must match .screen here),
     and the feature's steps on the right. clip.html?clip=xray&step=1 lights the second step. -->
<link rel="stylesheet" href="common.css">
<style>
body { --w: 860px; --h: 620px; }
.backdrop { --gx: 24%; --gy: 50%; --glx: 20%; --gly: 50%; }
.phone { left: 64px; top: 20px; width: 276px; height: 580px; --radius: 45px; --bezel: 8px; }
.copy { position: absolute; left: 398px; top: 0; bottom: 0; width: 404px; display: flex; flex-direction: column; justify-content: center; }
.copy h2 { margin: 16px 0 30px; font-size: 31px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li {
  position: relative; display: grid; grid-template-columns: 34px 1fr; gap: 2px; padding: 15px 18px 15px 16px;
  border-radius: 14px; border: 1px solid transparent; transition: none;
}
.steps .n { font: 500 11px/20px var(--mono); color: var(--faint); letter-spacing: .04em; }
.steps b { display: block; font-weight: 600; font-size: 15.5px; line-height: 20px; letter-spacing: -.015em; color: #8E867A; }
.steps p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: var(--faint); text-wrap: pretty; }
.steps li.on {
  background: linear-gradient(180deg, rgb(255 246 227 / .055), rgb(255 246 227 / .025));
  border-color: var(--hair-2);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .05), 0 16px 40px -24px rgb(0 0 0 / .9);
}
.steps li.on::before {
  content: ""; position: absolute; left: -1px; top: 14px; bottom: 14px; width: 2px; border-radius: 2px;
  background: var(--honey); box-shadow: 0 0 12px rgb(243 179 61 / .7);
}
.steps li.on .n { color: var(--honey); }
.steps li.on b { color: var(--cream); }
.steps li.on p { color: var(--muted); }
.brand { left: 414px; bottom: 30px; opacity: .9; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="phone"><div class="screen"></div></div>
<div class="copy">
  <div class="eyebrow" id="eyebrow"></div>
  <h2 id="title"></h2>
  <ol class="steps" id="steps"></ol>
</div>
<div class="brand"><img src="../app-icon.svg" alt=""><span>WatPath</span></div>
<script src="common.js"></script>
<script>
const CLIPS = {
  xray: {
    eyebrow: 'Street Map · Path Map',
    title: 'One tap to see through the walls.',
    steps: [
      ['Street Map', 'Apple Maps in 3D, with a marker on every entrance.'],
      ['Path Map', 'The same view, as the corridors, bridges and tunnels inside.'],
      ['Look around', 'Pan, tilt and turn either map. The camera never jumps.'],
    ],
  },
  search: {
    eyebrow: 'Search',
    title: 'Finds it, typos and all.',
    steps: [
      ['Before you type', 'Your recent places, and the ones everyone looks for.'],
      ['Forgiving', '“engineerign 5” still finds Engineering 5. Old names like E7 work too.'],
      ['Place cards', 'Its code, every floor and every entrance, one tap away.'],
    ],
  },
  directions: {
    eyebrow: 'Directions',
    title: 'Fastest, or warmest. You choose.',
    steps: [
      ['Start anywhere', 'From a search, a pin dropped inside a building, or where you are.'],
      ['Up to four routes', 'Each one trades a few minutes for less time outside.'],
      ['See before you go', 'Tap a route to see it on the map, with its floors and buildings.'],
    ],
  },
  navigation: {
    eyebrow: 'Navigation',
    title: 'Drag to walk the route.',
    steps: [
      ['Drag down to walk', 'The camera follows the goose through every turn.'],
      ['Swipe to look around', 'Let go, and it swings back to straight ahead.'],
      ['Outside, the street fades in', 'Then the Path Map comes back at the next door.'],
    ],
  },
};
const params = new URLSearchParams(location.search);
const clip = CLIPS[params.get('clip') ?? 'xray'];
const step = Number(params.get('step') ?? 0);
document.getElementById('eyebrow').textContent = clip.eyebrow;
document.getElementById('title').textContent = clip.title;
document.getElementById('steps').innerHTML = clip.steps.map(([title, body], i) =>
  `<li class="${i === step ? 'on' : ''}"><span class="n">0${i + 1}</span><div><b>${title}</b><p>${body}</p></div></li>`).join('');
window.ready = WP.ready();
</script>
</body>
</html>
