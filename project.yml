# XcodeGen spec. The .xcodeproj is generated (`make project`) and not committed.
name: WatPath
options:
  bundleIdPrefix: ca.yutochau
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  WatPathKit:
    path: Packages/WatPathKit
targets:
  WatPath:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: build/CampusBundle
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: WatPathKit
        product: CampusGeo
      - package: WatPathKit
        product: CampusModel
    preBuildScripts:
      - name: Check campus bundle
        script: '"${SRCROOT}/tools/check_bundle.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.yutochau.watpath
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WatPath
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: WatPath shows where you are on the campus map.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: NO
